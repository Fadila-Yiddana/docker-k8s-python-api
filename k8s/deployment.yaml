apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-k8s-python-api
spec:
  replicas:  2
  selector:
    matchLabels:
      app: docker-k8s-python-api
  template:
    metadata:
      labels:
        app: docker-k8s-python-api
    spec:
      containers:
        - name: api
          image:  225989365842.dkr.ecr.us-east-1.amazonaws.com/docker-k8s-python-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
